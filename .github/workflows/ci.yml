name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Integration tests create (and drop) a throwaway database on this server.
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: stagehand
          POSTGRES_PASSWORD: stagehand
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stagehand"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://stagehand:stagehand@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migrations are consistent
        run: pnpm db:check

      # Governance §15: database changes only through committed Drizzle migrations.
      # Regenerating from the schema must produce nothing new.
      - name: No schema change without a committed migration
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- apps/server/drizzle)" ]; then
            echo "::error::The Drizzle schema has changes with no committed migration. Run 'pnpm db:generate' and commit the result."
            git status --porcelain -- apps/server/drizzle
            exit 1
          fi

      - name: Integration tests
        run: pnpm test:integration

      - name: Build web
        run: pnpm --filter @stagehand/web build

  docker:
    name: Docker image + Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE: docker compose -f infra/docker-compose.yml --env-file infra/.env.ci
    steps:
      - uses: actions/checkout@v7

      - name: Build and start postgres, migrate, app
        run: $COMPOSE up -d --build --wait --wait-timeout 120

      - name: Migrations applied
        run: |
          test "$(docker inspect "$($COMPOSE ps -aq migrate)" --format '{{.State.ExitCode}}')" = 0
          $COMPOSE logs --no-log-prefix migrate
          $COMPOSE exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select extname from pg_extension"' | grep -qx pg_trgm

      - name: Health endpoint
        run: curl -fsS http://127.0.0.1:8080/health | tee /dev/stderr | grep -q '"status":"ok"'

      - name: SPA served, including client-side routes
        run: |
          curl -fsS -H 'accept: text/html' http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS -H 'accept: text/html' http://127.0.0.1:8080/campaigns/1 | grep -q '<div id="root">'

      # Real Discord sign-in can't run in CI (the integration tests cover it with a fake
      # Discord); this checks the production image wires auth up correctly.
      - name: Auth endpoints
        run: |
          curl -fsS http://127.0.0.1:8080/api/auth/ok | grep -q '"ok":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PATCH -H 'origin: https://evil.example' \
            -H 'content-type: application/json' -d '{"displayName":"x"}' http://127.0.0.1:8080/api/me)" = 403
          curl -fsS -X POST -H 'origin: http://localhost:8080' -H 'content-type: application/json' \
            -d '{"provider":"discord","callbackURL":"/"}' http://127.0.0.1:8080/api/auth/sign-in/social \
            | grep -q 'https://discord.com/api/oauth2/authorize?.*client_id=ci-dummy-client-id'

      - name: Security headers
        run: |
          headers="$(curl -fsS -D - -o /dev/null -H 'accept: text/html' http://127.0.0.1:8080/)"
          echo "$headers"
          echo "$headers" | grep -qi '^x-content-type-options: nosniff'
          echo "$headers" | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          echo "$headers" | grep -qi "^content-security-policy: frame-ancestors 'self'"
          # .env.ci's PUBLIC_URL is http, so no HSTS (it's only sent for https).
          ! echo "$headers" | grep -qi '^strict-transport-security'

      - name: App runs as non-root
        run: test "$($COMPOSE exec -T app id -un)" = node

      - name: Tunnel service config is valid
        run: $COMPOSE --profile tunnel config --quiet

      # Backups (F0.6, D-19): the real scripts, on Linux, against this stack.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Backup, shutdown and restore drill
        env:
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: |
          pnpm stack:backup --env infra/.env.ci
          pnpm stack:shutdown --env infra/.env.ci
          test -z "$($COMPOSE ps -q)"          # shutdown stopped everything
          pnpm stack:restore-drill --env infra/.env.ci
          ls -l "$BACKUP_DIR"
          cat "$BACKUP_DIR/restore-drill.log"
          test "$(ls "$BACKUP_DIR"/stagehand-*.stbak | wc -l)" = 2
          test "$(grep -c ' PASS ' "$BACKUP_DIR/restore-drill.log")" = 3
          ! grep -q ' FAIL ' "$BACKUP_DIR/restore-drill.log"

      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
